services:
  postgres:
    image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
    environment:
      POSTGRES_USER: vega
      POSTGRES_PASSWORD: vega
      POSTGRES_DB: vega_test
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - vega_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vega -d vega_test']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vega_postgres:
