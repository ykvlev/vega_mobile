    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Independent React Native web/JS-bundle checks only; not device or store release validation. The quality job remains mandatory and fails
    # on the unresolved forge advisory; this job is not a release approval.
    env:
      CI: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3106
      DATABASE_URL: postgresql://vega:vega@127.0.0.1:5432/vega_test?schema=public
