          test ! -e .env
          cp .env.example .env
      - name: Проверить генерацию native-проектов и разрешения
        run: pnpm check:mobile:native
      - name: Build API and React Native web export
        run: pnpm build:contracts && pnpm --filter @vega/api build && pnpm build:mobile
      - name: Compile iOS and Android JavaScript bundles
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
          EXPO_NO_TELEMETRY: '1'
          NODE_ENV: production
        run: |
          pnpm --filter @vega/mobile exec expo export --platform ios --max-workers 2 --output-dir "$RUNNER_TEMP/vega-ios-js"
          pnpm --filter @vega/mobile exec expo export --platform android --max-workers 2 --output-dir "$RUNNER_TEMP/vega-android-js"
      - name: Check customer mobile flow against real API
        run: pnpm test:mobile
      - name: Save safe React Native web screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: mobile-customer-browser-results
          path: test-results/mobile
          if-no-files-found: warn
          retention-days: 7
